<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>TeamSync</title>
<meta name="description" content="TeamSync: pembagian beban kerja tim yang adil, transparan, dan berbasis data.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: fixed left rail (nav + identity) beside a scrolling workspace; rail folds into a top bar on phones. */
:root {
  --bg: #f3f4f8;
  --surface: #ffffff;
  --surface-2: #eceef5;
  --ink: #161a2c;
  --muted: #5b6179;
  --line: #dcdfea;
  --accent: #2f4bd1;
  --accent-ink: #ffffff;
  --accent-soft: #e4e8ff;
  --track: #e4e6ef;
  --ok: #1d8a4b;
  --ok-soft: #dcf3e5;
  --warn: #b97c00;
  --warn-soft: #fbefd2;
  --crit: #cf3333;
  --crit-soft: #fbe0e0;
  --shadow: 0 1px 2px rgba(22,26,44,.06), 0 4px 16px rgba(22,26,44,.05);
  --f-display: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --f-body: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1120; --surface: #161a2b; --surface-2: #1e2337; --ink: #e8eaf4; --muted: #9ba1bb;
    --line: #2b3148; --accent: #8197ff; --accent-ink: #0e1120; --accent-soft: #232b55; --track: #262c43;
    --ok: #43c47b; --ok-soft: #173326; --warn: #e8b23e; --warn-soft: #3a2e12; --crit: #ff6b6b; --crit-soft: #3d1b1f;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1120; --surface: #161a2b; --surface-2: #1e2337; --ink: #e8eaf4; --muted: #9ba1bb;
  --line: #2b3148; --accent: #8197ff; --accent-ink: #0e1120; --accent-soft: #232b55; --track: #262c43;
  --ok: #43c47b; --ok-soft: #173326; --warn: #e8b23e; --warn-soft: #3a2e12; --crit: #ff6b6b; --crit-soft: #3d1b1f;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.5; }
h1, h2, h3, h4 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: 1.75rem; font-weight: 800; }
h2 { font-size: 1.15rem; font-weight: 700; }
h3 { font-size: 1rem; font-weight: 700; }
p { margin: 0; }
.num, .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.eyebrow { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .09em; color: var(--accent); }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* App frame */
.app { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 24px; padding-block: 24px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: 18px; background: var(--surface); border-right: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-weight: 800; font-size: 1.2rem; }
.brand small { display: block; font-size: .68rem; font-weight: 600; color: var(--muted); letter-spacing: .04em; }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; color: var(--muted); text-decoration: none; font-weight: 600; white-space: nowrap; }
.nav a:hover { background: var(--surface-2); color: var(--ink); }
.nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.nav svg { width: 18px; height: 18px; flex: none; }
.nav .count { margin-left: auto; background: var(--crit); color: #fff; font-size: .7rem; font-family: var(--f-mono); border-radius: 10px; padding: 0 7px; }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; font-size: .82rem; }
.whobox { background: var(--surface-2); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.whobox > label:not(.switch) { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.role-tag { display: inline-flex; align-self: flex-start; font-size: .72rem; font-weight: 700; padding: 2px 8px; border-radius: 6px; background: var(--accent); color: var(--accent-ink); }
.role-tag.member { background: var(--ok-soft); color: var(--ok); }
.role-tag.viewer { background: var(--track); color: var(--muted); }
.switch { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: .8rem; }
.switch input { accent-color: var(--accent); }

.main { min-width: 0; padding-block: 28px 64px; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 20px; }
.view { display: flex; flex-direction: column; gap: 24px; max-width: 1240px; width: 100%; }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; }
.page-head > div:first-child { display: flex; flex-direction: column; gap: 4px; }
.page-head p.lede { color: var(--muted); max-width: 62ch; }

.banner { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 10px 14px; border-radius: 10px; background: var(--accent-soft); color: var(--ink); font-size: .86rem; max-width: 1240px; }
.banner.warn { background: var(--warn-soft); }
.banner b { font-weight: 700; }

/* Buttons & inputs */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--crit); border-color: color-mix(in srgb, var(--crit) 40%, var(--line)); }
.btn.danger.armed { background: var(--crit); color: #fff; }
.btn.warn { background: var(--warn); border-color: var(--warn); color: #1b1300; }
.btn.sm { padding: 4px 10px; font-size: .8rem; border-radius: 6px; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > span { font-size: .78rem; font-weight: 700; color: var(--muted); }
.field small { color: var(--muted); font-size: .76rem; }
input[type=text], input[type=email], input[type=password], input[type=number], input[type=date], input[type=search], select, textarea {
  width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); min-width: 0;
}
textarea { resize: vertical; min-height: 64px; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; }

.seg { display: inline-flex; flex-wrap: wrap; background: var(--surface-2); border-radius: 9px; padding: 3px; gap: 2px; }
.seg label, .seg button { position: relative; padding: 6px 12px; border-radius: 7px; cursor: pointer; font-weight: 600; font-size: .82rem; color: var(--muted); border: 0; background: transparent; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label:has(input:checked), .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.seg label:has(input:focus-visible) { outline: 2px solid var(--accent); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.panel-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; }

/* Pills */
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: .72rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--track); color: var(--muted); white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.crit { background: var(--crit-soft); color: var(--crit); }
.pill.plain::before { display: none; }

/* KPIs */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; }
.kpi .k-label { font-size: .74rem; font-weight: 700; color: var(--muted); }
.kpi .k-val { font-family: var(--f-mono); font-size: 1.6rem; font-weight: 600; letter-spacing: -.02em; }
.kpi .k-sub { font-size: .76rem; color: var(--muted); }
.kpi.crit .k-val { color: var(--crit); }
.kpi.warn .k-val { color: var(--warn); }

/* Capacity meter: scale runs 0–120% so overload stays visible */
.meter { position: relative; padding-bottom: 14px; }
.meter .track { position: relative; height: 12px; border-radius: 6px; background: var(--track); overflow: hidden; }
.meter .fill { position: absolute; top: 0; bottom: 0; left: 0; transition: width .4s ease, left .4s ease; }
.meter .fill.pic { background: var(--c); }
.meter .fill.bak { background: repeating-linear-gradient(135deg, var(--c) 0 3px, transparent 3px 6px); opacity: .75; }
.meter .fill.add { background: repeating-linear-gradient(90deg, var(--accent) 0 2px, transparent 2px 4px); outline: 1.5px solid var(--accent); outline-offset: -1.5px; }
.meter .tick { position: absolute; top: -3px; height: 18px; width: 0; border-left: 1.5px dashed var(--muted); }
.meter .tick.red { border-left-color: var(--crit); }
.meter .tick-l { position: absolute; top: 16px; transform: translateX(-50%); font-family: var(--f-mono); font-size: .62rem; color: var(--muted); }
.lv-green { --c: var(--ok); }
.lv-yellow { --c: var(--warn); }
.lv-red { --c: var(--crit); }
.meter.slim .track { height: 8px; }
.meter.slim { padding-bottom: 0; }
.meter.slim .tick { height: 14px; }

/* Member cards */
.members-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.mcard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; position: relative; }
.mcard.lv-red { border-color: color-mix(in srgb, var(--crit) 55%, var(--line)); }
.mc-top { display: flex; align-items: center; gap: 10px; }
.mc-top > div { min-width: 0; flex: 1; }
.mc-top h3 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mc-top p { font-size: .78rem; color: var(--muted); }
.avatar { width: 36px; height: 36px; flex: none; border-radius: 10px; display: grid; place-items: center; font-weight: 800; font-size: .8rem; color: #fff; background: var(--av, var(--accent)); }
.avatar.sm { width: 24px; height: 24px; border-radius: 7px; font-size: .62rem; }
.mc-nums { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.mc-nums .big { font-family: var(--f-mono); font-size: 1.5rem; font-weight: 600; color: var(--c); }
.mc-nums span { font-family: var(--f-mono); font-size: .8rem; color: var(--muted); }
.mc-break { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .78rem; color: var(--muted); }
.mc-break b { color: var(--ink); font-family: var(--f-mono); font-weight: 600; }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; background: var(--c, var(--muted)); }
.swatch.striped { background: repeating-linear-gradient(135deg, var(--c, var(--muted)) 0 2px, transparent 2px 4px); outline: 1px solid var(--c, var(--muted)); outline-offset: -1px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .78rem; color: var(--muted); }

/* Alerts */
.alerts { display: flex; flex-direction: column; gap: 10px; }
.alert { border: 1px solid color-mix(in srgb, var(--crit) 45%, var(--line)); background: var(--crit-soft); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.alert.warn { border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); background: var(--warn-soft); }
.alert-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.alert-head h3 { font-size: .95rem; }
.alert-task { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 14px; background: var(--surface); border-radius: 9px; padding: 10px 12px; }
.alert-task .t { min-width: 0; flex: 1 1 260px; }
.alert-task .t b { display: block; }
.alert-task .t small { color: var(--muted); }

/* Board */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.toolbar input[type=search] { max-width: 260px; }
.toolbar select { width: auto; }
.board { display: grid; grid-template-columns: repeat(4, minmax(220px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 6px; }
.col { background: var(--surface-2); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 160px; }
.col-head { display: flex; justify-content: space-between; align-items: center; padding: 4px 6px; font-weight: 700; font-size: .84rem; }
.col-head .num { color: var(--muted); font-size: .76rem; }
.tcard { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; cursor: pointer; text-align: left; }
.tcard:hover { border-color: var(--accent); }
.tcard.flag { border-left: 3px solid var(--crit); }
.tcard h4 { font-size: .9rem; font-weight: 700; line-height: 1.35; }
.tmeta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: .74rem; color: var(--muted); }
.wbadge { font-family: var(--f-mono); font-weight: 600; font-size: .72rem; padding: 1px 7px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); }
.people { display: flex; flex-wrap: wrap; gap: 6px; font-size: .76rem; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px 2px 2px; border-radius: 999px; background: var(--surface-2); font-weight: 600; }
.chip .avatar { width: 18px; height: 18px; border-radius: 50%; font-size: .55rem; }
.chip.bak { background: transparent; border: 1px dashed var(--line); color: var(--muted); }
.tcard select { padding: 4px 8px; font-size: .78rem; }
.due.late { color: var(--crit); font-weight: 700; }
.due.soon { color: var(--warn); font-weight: 700; }

/* Composer */
.composer { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 18px; }
.calc { background: var(--surface-2); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
.calc .wt { display: flex; align-items: baseline; gap: 8px; }
.calc .wt .num { font-size: 2.4rem; font-weight: 600; color: var(--accent); line-height: 1; }
.calc .formula { font-family: var(--f-mono); font-size: .76rem; color: var(--muted); overflow-wrap: anywhere; }
.rec-list { display: flex; flex-direction: column; gap: 8px; }
.rec { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 6px 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.rec.sel-pic { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.rec.sel-bak { border-style: dashed; border-color: var(--accent); }
.rec .who b { display: block; }
.rec .who small { color: var(--muted); font-size: .74rem; }
.rec .acts { display: flex; gap: 4px; }
.rec .acts .btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.rec .meter { grid-column: 1 / -1; }
.rec .proj { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: .74rem; color: var(--muted); }
.rank { font-family: var(--f-mono); font-size: .72rem; color: var(--muted); width: 18px; }
.summary { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 14px; }
.summary .who-line { font-size: .86rem; }
.error-text { color: var(--crit); font-size: .82rem; font-weight: 600; }

/* Tables */
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
table { width: 100%; border-collapse: collapse; font-size: .86rem; }
th { text-align: left; font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; }
td { padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.n, th.n { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.namecell { display: flex; align-items: center; gap: 10px; min-width: 160px; }
.namecell small { display: block; color: var(--muted); font-size: .74rem; }

/* Log */
.log { display: flex; flex-direction: column; }
.log-item { display: grid; grid-template-columns: 12px minmax(0,1fr) auto; gap: 12px; padding: 10px 2px; border-bottom: 1px solid var(--line); align-items: start; }
.log-item:last-child { border-bottom: 0; }
.log-item .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 5px; background: var(--muted); }
.log-item .dot.task_new { background: var(--accent); }
.log-item .dot.status { background: var(--ok); }
.log-item .dot.handover { background: var(--crit); }
.log-item .dot.member { background: var(--warn); }
.log-item time { font-family: var(--f-mono); font-size: .72rem; color: var(--muted); white-space: nowrap; }
.log-item .actor { color: var(--muted); font-size: .76rem; }

/* Chart */
.chart svg { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-family: var(--f-mono); font-size: 11px; }
.chart text.lbl { fill: var(--ink); font-family: var(--f-body); font-size: 12px; font-weight: 600; }
.chart .grid { stroke: var(--line); }
.chart .bar { fill: var(--accent); }
.chart .bar2 { fill: var(--ok); }

.empty { text-align: center; padding: 40px 20px; border: 1.5px dashed var(--line); border-radius: 14px; display: flex; flex-direction: column; align-items: center; gap: 12px; color: var(--muted); }
.empty h2 { color: var(--ink); }
.empty .row { justify-content: center; }
.col .empty-col { color: var(--muted); font-size: .78rem; padding: 10px 6px; }
.note { font-size: .78rem; color: var(--muted); }

/* Modal */
.modal-bg { position: fixed; inset: 0; background: rgba(10,12,24,.5); z-index: 50; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modal { width: min(620px, 100%); max-height: 100%; overflow-y: auto; background: var(--surface); border-radius: 16px; padding: 22px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
.modal-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.modal-foot { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; border-top: 1px solid var(--line); padding-top: 14px; }
.modal-foot .row { gap: 8px; }
.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
.kv div { background: var(--surface-2); border-radius: 9px; padding: 8px 10px; }
.kv dt { font-size: .7rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.kv dd { margin: 0; font-weight: 600; }
dl { margin: 0; }

/* Toasts */
.toasts { position: fixed; z-index: 60; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; width: min(360px, calc(100vw - 32px)); }
.toast { background: var(--ink); color: var(--bg); border-radius: 10px; padding: 12px 14px; font-size: .84rem; box-shadow: 0 10px 30px rgba(0,0,0,.25); display: flex; gap: 10px; align-items: flex-start; animation: tin .25s ease; }
.toast.crit { border-left: 4px solid var(--crit); }
.toast.ok { border-left: 4px solid var(--ok); }
.toast .x { margin-left: auto; background: none; border: 0; color: inherit; opacity: .7; cursor: pointer; }
@keyframes tin { from { transform: translateY(8px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }


.rec-list .banner, .panel > .banner { display: block; }
/* Skill */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips.sm { gap: 4px; margin-top: 4px; }
.chips button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 10px; font-size: .76rem; font-weight: 600; cursor: pointer; color: var(--muted); }
.chips button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.skill { display: inline-block; font-size: .7rem; font-weight: 700; padding: 1px 7px; border-radius: 6px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.skill.ok { background: var(--ok-soft); color: var(--ok); }
.skill.miss { background: var(--crit-soft); color: var(--crit); }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 14px; }
.rec .proj .num { color: var(--ink); }

/* Minggu pada kartu anggota & heatmap */
.mc-weeks { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: .74rem; border-top: 1px dashed var(--line); padding-top: 10px; }
.mc-weeks a { color: var(--muted); text-decoration: none; font-weight: 700; margin-right: 2px; }
.wchip { padding: 2px 8px; border-radius: 6px; background: var(--hb); color: var(--hc); font-weight: 600; }
.wchip b { font-family: var(--f-mono); }
.h-green { --hb: var(--ok-soft); --hc: var(--ok); }
.h-yellow { --hb: var(--warn-soft); --hc: var(--warn); }
.h-red { --hb: var(--crit-soft); --hc: var(--crit); }
.h-none { --hb: var(--surface-2); --hc: var(--muted); }
.heat th.c, .heat td.c, .simtable th.c { text-align: center; white-space: nowrap; }
.heat th small { display: block; font-size: .62rem; color: var(--accent); letter-spacing: .04em; }
.heat td.cell, .simtable td.cell { padding: 4px; }
.cell button, .cell span { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; min-width: 62px; min-height: 40px; border: 0; border-radius: 7px; background: var(--hb); color: var(--hc); font-family: var(--f-mono); font-weight: 600; font-size: .82rem; cursor: pointer; }
.cell span { cursor: default; min-height: 30px; }
.cell button small { font-family: var(--f-body); font-size: .6rem; font-weight: 700; opacity: .85; }
.cell button[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 1px; }
.heat tfoot td { background: var(--surface-2); font-weight: 600; }
.plan-detail { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--line); padding-top: 14px; }
.leave-form { display: grid; grid-template-columns: 1.3fr 1fr 1fr .8fr 1.4fr auto; gap: 10px; align-items: end; }

/* Keadilan */
.fair-grid { display: grid; grid-template-columns: minmax(0, 320px) minmax(0, 1fr); gap: 18px; align-items: start; }
.fair-metrics { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
.fair-metrics > div { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.fair-metrics .k-label { font-size: .7rem; font-weight: 700; color: var(--muted); }
.fair-metrics b { font-size: 1.25rem; }
.fair-metrics small { font-size: .7rem; color: var(--muted); }
.strip svg { width: 100%; height: auto; display: block; }
.strip text { fill: var(--muted); font-family: var(--f-mono); font-size: 10px; }
.strip text.ini { fill: #fff; font-family: var(--f-body); font-size: 6.5px; font-weight: 800; }
.strip text.mean-t { fill: var(--accent); font-weight: 600; }
.strip .grid { stroke: var(--line); }
.strip .mean { stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 4 3; }
.strip .z-warn { fill: var(--warn-soft); }
.strip .z-crit { fill: var(--crit-soft); }
.fair-hist { display: flex; flex-direction: column; }
.fair-hist > div { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: .8rem; align-items: baseline; }
.fair-hist time { font-family: var(--f-mono); font-size: .7rem; color: var(--muted); white-space: nowrap; }
.delta { font-family: var(--f-mono); font-weight: 700; }
.delta.up { color: var(--ok); }
.delta.down { color: var(--crit); }

/* Simulasi */
.sim-events { display: flex; flex-direction: column; gap: 10px; }
.sim-ev { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); }
.sim-ev .field { flex: 1 1 130px; }
.sim-ev .wide { flex: 3 1 260px; }
.sim-ev .ev-tag { flex: 0 0 100%; }
.ev-tag { align-self: center; font-size: .72rem; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); }
.sim-run { border-top: 1px solid var(--line); padding-top: 14px; }
.cmp { min-width: 140px; }
.cmpbar { height: 7px; border-radius: 4px; background: var(--track); overflow: hidden; margin: 2px 0; }
.cmpbar i { display: block; height: 100%; background: var(--c); opacity: .45; }
.cmpbar.after i { opacity: 1; }
.chg-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.chg { display: grid; grid-template-columns: 120px minmax(0,1fr); gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: .86rem; align-items: start; }
.chg small { display: block; color: var(--muted); font-size: .76rem; }
.chg.assign .pill { background: var(--accent-soft); color: var(--accent); }
.chg.reassign .pill { background: var(--crit-soft); color: var(--crit); }
.chg.rebalance .pill { background: var(--ok-soft); color: var(--ok); }
.chg.deadline .pill { background: var(--warn-soft); color: var(--warn); }
.warn-list { margin: 4px 0 0; padding-left: 18px; }
.simtable td.n { white-space: nowrap; }
@media (max-width: 820px) { .chg { grid-template-columns: minmax(0,1fr); } }
/* Halaman masuk */
#auth { min-height: 100vh; display: grid; place-items: center; padding-block: 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.auth-card { width: min(420px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 18px; box-shadow: var(--shadow); }
.auth-card h1 { font-size: 1.4rem; }
.auth-card form { display: flex; flex-direction: column; gap: 14px; }
.auth-links { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px; }
.auth-links .btn { padding-inline: 0; color: var(--accent); }
@media (max-width: 1100px) { .composer { grid-template-columns: minmax(0,1fr); } .grid4 { grid-template-columns: repeat(2, minmax(0,1fr)); } .fair-grid { grid-template-columns: minmax(0,1fr); } }
@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0,1fr); }
  .side { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-right: 0; border-bottom: 1px solid var(--line); }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 21; background: var(--surface); }
  .nav { flex-direction: row; order: 3; width: 100%; overflow-x: auto; gap: 2px; }
  .nav a { padding: 7px 10px; }
  .side-foot { margin: 0 0 0 auto; }
  .whobox { padding: 6px 10px; flex-direction: row; align-items: center; flex-wrap: wrap; }
  .whobox label, .whobox .switch, .whobox .claim-wrap { display: none; }
  .main { padding-block: 18px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .kpis { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .grid4, .leave-form { grid-template-columns: minmax(0,1fr); }
  .fair-metrics { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .grid2, .grid3 { grid-template-columns: minmax(0,1fr); }
  h1 { font-size: 1.4rem; }
  .board { grid-template-columns: repeat(4, minmax(240px, 82vw)); }
}
</style>
